name: Niederschlagsdaten aktualisieren

on:
  schedule:
    - cron: "30 4 * * *"  # taeglich 04:30 UTC (DWD "recent" wird ~1x/Tag aktualisiert)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install certifi

      - run: python scripts/precompute.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Niederschlagsdaten aktualisiert"
          git push
