<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Niederschlag Deutschland</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Niederschlag Deutschland</h1>
    <div class="sub" id="footerInfoTop">Daten des Deutschen Wetterdienstes (DWD Open Data)</div>

    <div class="controls">
      <div class="scope-toggle">
        <button data-scope="stadt" class="active">Stadt</button>
        <button data-scope="bundesland">Bundesland</button>
        <button data-scope="deutschland">Deutschland</button>
      </div>
      <select id="citySelect"></select>
      <select id="landSelect" class="hidden"></select>
    </div>

    <div class="ranges">
      <button data-range="24h">24 Stunden</button>
      <button data-range="7d" class="active">7 Tage</button>
      <button data-range="week">Woche</button>
      <button data-range="month">Monat</button>
      <button data-range="halfyear">Halbjahr</button>
      <button data-range="season">Jahreszeit</button>
      <button data-range="year">Jahr</button>
      <button data-range="decade">Jahrzehnt</button>
    </div>
    <div class="custom-range">
      oder Zeitraum:
      <input type="date" id="fromDate" />
      –
      <input type="date" id="toDate" />
    </div>

    <div class="stat">
      <div class="value" id="statValue">–</div>
      <div class="unit">mm</div>
    </div>
    <div class="stat-label" id="statLabel"></div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

    <div class="info-row">
      <span id="infoStations"></span>
      <span id="infoRange"></span>
    </div>

    <h2>Vergleich</h2>
    <div class="ranges cmp-ranges">
      <button data-cmp="month" class="active">Monat vs. Vorjahr</button>
      <button data-cmp="year">Jahr vs. Vorjahr</button>
      <button data-cmp="season">Saison vs. Vorjahr</button>
      <button data-cmp="decade">Jahrzehnt vs. Vorjahrzehnt</button>
      <button data-cmp="nyears">Zeitraum frei</button>
    </div>
    <div class="cmp-years hidden" id="cmpYearsWrap">
      Anzahl Jahre: <input type="number" id="cmpYears" min="1" max="15" value="5" />
      vs. die gleiche Anzahl Jahre davor
    </div>

    <div class="cmp-stats">
      <div class="cmp-stat">
        <div class="value" id="cmpCurrentValue">–</div>
        <div class="unit">mm</div>
        <div class="cmp-label" id="cmpCurrentLabel"></div>
      </div>
      <div class="cmp-delta" id="cmpDelta">–</div>
      <div class="cmp-stat">
        <div class="value" id="cmpPriorValue">–</div>
        <div class="unit">mm</div>
        <div class="cmp-label" id="cmpPriorLabel"></div>
      </div>
    </div>

    <div class="cmp-extra-toggle-row">
      <button id="cmpExtraToggle" class="cmp-extra-toggle">+ weitere Jahre vergleichen</button>
    </div>
    <div class="cmp-extra-panel hidden" id="cmpExtraPanel">
      <div class="cmp-extra-label" id="cmpExtraLabel"></div>
      <div class="cmp-extra-pills" id="cmpExtraPills"></div>
    </div>

    <div class="chart-wrap">
      <canvas id="compareChart"></canvas>
    </div>
    <div class="coverage-note hidden" id="cmpCoverageNote"></div>

    <footer id="footerInfo"></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
